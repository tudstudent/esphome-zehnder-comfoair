# Optional preheater energy/power. No heater controls are exposed.
substitutions:
  comfoair_canbus_id: comfoair_canbus

zehnder_comfoair_q:
  request_ids: [144, 145, 146]

sensor:
  - platform: template
    id: preheater_energy_ytd
    name: "Preheater Energy YTD"
    update_interval: never
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    id: preheater_energy_total
    name: "Preheater Energy Total"
    update_interval: never
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    id: preheater_power
    name: "Preheater Power"
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

canbus:
  - id: !extend ${comfoair_canbus_id}
    on_frame:
      - can_id: 0x40
        can_id_mask: 0x1e003fc0
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: |-
              switch (id(comfoair)->get_pdo_id_from_can_id (can_id)) {
                  comfoair_on_frame_case(144, id(comfoair), preheater_energy_ytd);
                  comfoair_on_frame_case(145, id(comfoair), preheater_energy_total);
                  comfoair_on_frame_case(146, id(comfoair), preheater_power);
              }
