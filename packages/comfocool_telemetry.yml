# Explicitly declare installed hardware; an Off/default value is not presence.
substitutions:
  comfoair_canbus_id: comfoair_canbus
  comfocool_installed: "false"

zehnder_comfoair_q:
  request_ids: ${ [85, 784, 785, 802] if comfocool_installed == 'true' else [] }

sensor:
  - platform: template
    id: next_comfocool_change_in_raw
    internal: true
    update_interval: never
    accuracy_decimals: 0
    device_class: duration
    unit_of_measurement: "s"
  - platform: template
    id: comfocool_condenser_temperature
    name: "ComfoCool Condenser Temperature"
    update_interval: never
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "\u00b0C"
    accuracy_decimals: 1
    filters: [multiply: 0.1]

binary_sensor:
  - platform: template
    id: comfocool_compressor_state
    name: "ComfoCool Compressor State"
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: comfocool_state
    name: "ComfoCool State"
    update_interval: never
    filters:
      - map:
          - 0 -> Off
          - 1 -> On
  - platform: template
    id: next_comfocool_change_in
    name: "Next ComfoCool Change In"
    update_interval: never
    entity_category: diagnostic

canbus:
  - id: !extend ${comfoair_canbus_id}
    on_frame:
      - can_id: 0x40
        can_id_mask: 0x1f003fc0
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: |-
              constexpr std::string_view installed = "${comfocool_installed}";
              static_assert(installed == "true" || installed == "false", "comfocool_installed must be true or false");
              if (installed != "true") return;
              switch (id(comfoair)->get_pdo_id_from_can_id (can_id)) {
                  case 85:
                      id(comfoair)->publish_duration_state(id(next_comfocool_change_in_raw), id(next_comfocool_change_in), x);
                      break;
                  comfoair_on_frame_case(784, id(comfoair), comfocool_state);
                  comfoair_on_frame_case(785, id(comfoair), comfocool_compressor_state);
                  comfoair_on_frame_case(802, id(comfoair), comfocool_condenser_temperature);
              }
